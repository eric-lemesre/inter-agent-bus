[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inter-agent-bus"
version = "0.16.0"
description = "Coordination bus between heterogeneous AI agents: task queues with claim/ack leases, shared result store (SQLite), roster-driven routing — the mechanism, never the cast."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.10"
keywords = ["agents", "mcp", "multi-agent", "orchestration", "task-queue", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
server = ["mcp>=2.0"]
hub = ["cryptography>=42"]
postgres = ["psycopg>=3.2"]
# Pairing with a TPM key (`iab join --tpm`, Linux): builds against the TSS
# (libtss2-dev); the python3-tpm2-pytss package is an alternative.
tpm = ["tpm2-pytss>=2.1"]

[project.urls]
Homepage = "https://github.com/eric-lemesre/inter-agent-bus"
Repository = "https://github.com/eric-lemesre/inter-agent-bus"
Issues = "https://github.com/eric-lemesre/inter-agent-bus/issues"

[project.scripts]
iab = "iab.cli:main"
iab-server = "iab.server:main"

[tool.setuptools]
packages = ["iab"]

[tool.setuptools.package-dir]
iab = "servers/shared_memory"

[tool.setuptools.package-data]
iab = ["tpm_roots.pem"]
