name: publish

# A GitHub release publishes the Python package on PyPI, by trusted
# publishing (OpenID Connect): no token is stored anywhere. The pending
# publisher is declared once on pypi.org for this repository, this file
# and the `pypi` environment. The same release gets the native Linux
# executables (static, musl) as an archive with its SHA256SUMS.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: The tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "${{ github.event.release.tag_name }}" \
            || { echo "tag ${{ github.event.release.tag_name }} != version $version"; exit 1; }
      - name: Build
        run: python -m pip install build twine && python -m build && python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/inter-agent-bus/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  linux-binaries:
    name: Native executables for Linux (x86_64, static)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # attach the archive to the release, this job only
    env:
      TARGET: x86_64-unknown-linux-musl
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the crate version
        run: |
          version=$(grep -m1 '^version = ' rust/Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$TAG" || { echo "tag $TAG != version $version"; exit 1; }
      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup update stable && rustup default stable && rustup target add "$TARGET"
      - name: Build
        working-directory: rust
        run: cargo build --release --locked --target "$TARGET"
      - name: Package
        run: |
          name="iab-${TAG#v}-$TARGET"
          mkdir -p "dist/$name"
          cp "rust/target/$TARGET/release/iab" "rust/target/$TARGET/release/iab-server" \
             LICENSE-MIT LICENSE-APACHE README.md README.fr.md "dist/$name/"
          "dist/$name/iab" --version | grep -qx "iab ${TAG#v}"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
