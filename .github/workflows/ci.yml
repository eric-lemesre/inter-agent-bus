name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[server,hub,postgres]" "psycopg[binary]"
      - name: Core (store_test)
        run: python servers/shared_memory/store_test.py
      - name: Hub (hub_test)
        run: python servers/shared_memory/hub_test.py
      - name: TPM attestation, software chip (attest_test)
        run: python servers/shared_memory/attest_test.py
      - name: End to end (smoke)
        run: python scripts/smoke.py
      - name: Conformance (SQLite)
        run: python conformance/run.py

  postgres-tls:
    name: PostgreSQL over TLS (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[server,hub,postgres]" "psycopg[binary]"
      # A cluster that accepts the bus role only over TLS with a client
      # certificate; the URL uses sslmode=verify-full. The script refuses to
      # hand out a URL if clear text, a foreign authority or a wrong host
      # name would be accepted.
      - name: Start the TLS bench
        run: |
          url=$(python scripts/pg_tls.py start "$RUNNER_TEMP/pg")
          echo "IAB_TEST_POSTGRES=$url" >> "$GITHUB_ENV"
      - name: Core on PostgreSQL (store_test)
        run: python servers/shared_memory/store_test.py
      - name: Conformance on PostgreSQL
        run: python conformance/run.py
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/pg/pg_ctl.log" "$RUNNER_TEMP/pg/server.log" || true
      - name: Stop the bench
        if: always()
        run: python scripts/pg_tls.py stop "$RUNNER_TEMP/pg"

  rust:
    name: native client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Lints
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Unit and behaviour tests
        run: cargo test --manifest-path rust/Cargo.toml --locked
      - name: Build
        run: cargo build --manifest-path rust/Cargo.toml --release --locked
      - name: Install the Python implementation
        run: python -m pip install -e .
      # Every scenario on the four pairs python/python, python/rust,
      # rust/python, rust/rust sharing one database. `worker` arrives in
      # the native client at step R4.
      - name: Conformance, Python and native client crossed (SQLite)
        run: |
          py=$(python -c "import json, os, sys; print(json.dumps([sys.executable, os.path.abspath('servers/shared_memory/cli.py')]))")
          rs=$(python -c "import json, os; print(json.dumps([os.path.abspath(os.path.join('rust', 'target', 'release', 'iab.exe' if os.name == 'nt' else 'iab'))]))")
          python conformance/run.py --impl "python=$py" --impl "rust=$rs" --without rust=worker
